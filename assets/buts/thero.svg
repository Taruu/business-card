<svg width="88" height="31" viewBox="0 0 88 31" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt { font-family: 'JetBrains Mono', monospace; font-weight: bold; }
    .blink { animation: b 2s infinite; }
    @keyframes b { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.3; } }
  </style>
  <!-- Background & Border -->
  <rect width="88" height="31" fill="#111111" />
  <rect x="0.5" y="0.5" width="87" height="30" fill="none" stroke="#FF4400" stroke-width="1" />

  <!-- Left Orange Warning Bar -->
  <rect x="0" y="0" width="8" height="31" fill="#FF4400" />
  <!-- Industrial stripes -->
  <path d="M0,4 L8,0 M0,12 L8,8 M0,20 L8,16 M0,28 L8,24" stroke="#111111" stroke-width="1" />

  <!-- Status Light -->
  <circle cx="16" cy="15.5" r="2.5" fill="#22C55E" />
  <circle cx="16" cy="15.5" r="4.5" fill="none" stroke="#22C55E" stroke-width="0.5" class="blink" />

  <!-- Typography -->
  <text x="24" y="13" fill="#F2F0E9" font-size="8" class="txt" letter-spacing="0.5">THERODEV</text>
  <text x="24" y="23" fill="#FF4400" font-size="7" class="txt" letter-spacing="0">SYS_ONLINE</text>

  <!-- Corner Brackets -->
  <path d="M 84 5 L 84 3 L 81 3" fill="none" stroke="#FF4400" stroke-width="1" />
  <path d="M 84 26 L 84 28 L 81 28" fill="none" stroke="#FF4400" stroke-width="1" />
</svg>