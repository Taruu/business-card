<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 31" width="88" height="31">
    <defs>
        <!-- Background Gradient (Sky to Deep Lake) -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a1226"/>
            <stop offset="50%" stop-color="#142852"/>
            <stop offset="100%" stop-color="#1b366d"/>
        </linearGradient>

        <!-- Frosted Glass Surface Gradient -->
        <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="40%" stop-color="#7ea9df" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#3b69a6" stop-opacity="0.28"/>
        </linearGradient>

        <!-- Glass Specular Highlight / Border -->
        <linearGradient id="glassBorder" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
            <stop offset="50%" stop-color="#99c3ff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
        </linearGradient>

        <!-- Left Badge Glow -->
        <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.15"/>
        </linearGradient>
    </defs>

    <!-- Outer Canvas / Bevel Edge -->
    <rect width="88" height="31" rx="3" fill="#060b17"/>

    <!-- Pixel Art Sky & Mountain Backdrop -->
    <rect x="1" y="1" width="86" height="29" rx="2" fill="url(#skyGrad)"/>

    <!-- Pixel Art Stars & Scenery Details -->
    <g shape-rendering="crispEdges" opacity="0.85">
        <!-- Tiny Stars -->
        <rect x="10" y="3" width="1" height="1" fill="#e0f2fe"/>
        <rect x="34" y="5" width="1" height="1" fill="#7dd3fc"/>
        <rect x="52" y="2" width="1" height="1" fill="#e0f2fe"/>
        <rect x="79" y="4" width="1" height="1" fill="#bae6fd"/>
        <rect x="68" y="7" width="1" height="1" fill="#38bdf8" opacity="0.6"/>

        <!-- Distant Pixel Ruins/Mountains (Right side) -->
        <path d="M64,19 h2 v-2 h2 v-3 h2 v-2 h1 v-2 h2 v3 h1 v2 h2 v-3 h1 v-2 h2 v3 h2 v2 h2 v3 h4 v11 h-21 z" fill="#1b3663" opacity="0.75"/>
        <path d="M69,14 h1 v-2 h1 v2 h-2 z M74,12 h1 v1 h-1 z" fill="#34d399" opacity="0.7"/>
        <!-- Water / Fog Reflection Lines -->
        <rect x="61" y="23" width="22" height="1" fill="#60a5fa" opacity="0.25"/>
        <rect x="65" y="25" width="15" height="1" fill="#38bdf8" opacity="0.2"/>
    </g>

    <!-- Frosted Glass UI Container -->
    <rect x="2" y="2" width="84" height="27" rx="3" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="0.8"/>

    <!-- Top Specular Glare -->
    <line x1="5" y1="2.8" x2="83" y2="2.8" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" opacity="0.75"/>

    <!-- Left Accent: Sub-panel with Code Icon </> -->
    <rect x="4.5" y="4.5" width="18" height="22" rx="2" fill="url(#badgeGrad)" stroke="#93c5fd" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Code Bracket Icon (Pixel-sharp) -->
    <g stroke="#e0f2fe" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M9 12.5 L7 15.5 L9 18.5"/>
        <path d="M18 12.5 L20 15.5 L18 18.5"/>
        <line x1="14.5" y1="12" x2="12.5" y2="19" stroke="#38bdf8"/>
    </g>

    <!-- Typography -->
    <g font-family="'Orbitron', 'Space Grotesk', 'Rajdhani', 'Segoe UI', system-ui, sans-serif">
        <!-- Name / Main Header -->
        <text x="27" y="14"
              font-size="8.5"
              font-weight="800"
              letter-spacing="1.2"
              fill="#ffffff"
              style="text-shadow: 0 0 4px rgba(56, 189, 248, 0.6);">PINUS</text>

        <!-- Subtitle / Tagline -->
        <text x="27.5" y="22.5"
              font-size="4.8"
              font-weight="700"
              letter-spacing="0.9"
              fill="#93c5fd">SOFTWARE DEV</text>
    </g>

    <!-- Decorative UI Corner Accent -->
    <circle cx="81.5" cy="6.5" r="1" fill="#38bdf8" opacity="0.8"/>
</svg>